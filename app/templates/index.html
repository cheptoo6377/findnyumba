{% extends 'base.html' %}

{% block title %}Job Listings{% endblock %}

{% block content %}
    <h1>Job Listings</h1>
    <ul>
        {% for job in jobs %}
        <li>
            <a href="{{ url_for('job_detail', job_id=job.id) }}">{{ job.title }}</a> at {{ job.company }}
        </li>
        {% endfor %}
    </ul>
{% endblock %}
