{% extends "base.html" %}

{% block title %}Home - Findjob Website{% endblock %}

{% block content %}
<style>
    body {
        background-image: url("{{ url_for('static', filename='background.jpg') }}");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center center;
        min-height: 100vh;
    }
    .container {
        background: rgba(255,255,255,0.85);
        border-radius: 12px;
        padding: 2rem;
        margin-top: 3rem;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
</style>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1>Welcome to the Job Search Website</h1>
            <p class="lead">Find your dream job or the perfect candidate!</p>
            <a href="{{ url_for('main.register') }}" class="btn btn-success m-2">Register</a>
            <a href="{{ url_for('main.login') }}" class="btn btn-primary m-2">Login</a>
        </div>
    </div>
</div>
{% endblock %}
