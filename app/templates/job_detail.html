{% extends 'base.html' %}

{% block title %}{{ job.title }}{% endblock %}

{% block content %}
<div class="job-detail">
    <h1>{{ job.title }}</h1>
    <h2>Company: {{ job.company }}</h2>
    <p><strong>Description:</strong></p>
    <p>{{ job.description }}</p>
    <a href="{{ url_for('index') }}">Back to Job Listings</a>
</div>
{% endblock %}
